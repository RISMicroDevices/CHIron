[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
maximum_cycles                  = 200000

# Reset stage: reset_repeat pulses, each reset_cycles cycles reset-active
# followed by reset_cycles cycles reset-inactive (high-active reset).
reset_cycles                    = 100
reset_repeat                    = 1

# The verilated wrapper always exposes 8 Type-1 pin sets, so 8 node IDs must
# be listed. Nodes beyond the stimulator's active list attach but stay idle;
# active upstream indices must be < the build's NUM_T1 (default 4).
upstream.type1.nodeid           = 0, 1, 2, 3, 4, 5, 6, 7
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

# TX-channel (upstream -> DUT) FIFO depths of the CCHI interface, per channel,
# applied to all Type-1 ports. Default 4. 0 frees the FIFO and falls back to
# the unbuffered direct-drive path, which carries a known stale-ready hazard
# (see V3CCHIInterface constructor comment) — not recommended.
upstream.type1.buffer.evt       = 4
upstream.type1.buffer.req       = 4
upstream.type1.buffer.rsp       = 4
upstream.type1.buffer.dat       = 4

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0, 1, 2, 3

stimulator.1                    = Core2Core
stimulator.1.enable             = 0
stimulator.1.upstreams.type1    = 0, 1

stimulator.2                    =
stimulator.2.enable             = 0

stimulator.3                    =
stimulator.3.enable             = 0

stimulator.4                    =
stimulator.4.enable             = 0

stimulator.5                    =
stimulator.5.enable             = 0

stimulator.6                    =
stimulator.6.enable             = 0

stimulator.7                    =
stimulator.7.enable             = 0

[stimulator.0]
verbose = 1
verbose.flit = 0
verbose.xact = 0
verbose.internal = 0
verbose.backpressure = 0
verbose.port.busy = 0

fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 400
fuzz.ari.target                 = 2
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2684354560
fuzz.ari.cmo.enable             = 1
# Per-source enables: each driven source can be switched off individually
# (default 1). A class is active iff its class switch above is on AND at
# least one of its sources is enabled; all six off = idle stimulator.
fuzz.ari.load.enable            = 1
fuzz.ari.store.enable           = 1
fuzz.ari.storeline.enable       = 1
fuzz.ari.cmo.clean.enable       = 1
fuzz.ari.cmo.flush.enable       = 1
fuzz.ari.cmo.inval.enable       = 1
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

# Example: core-to-core latency benchmark stimulator (a replication of
# nviennot/core-to-core-latency on the CCHI bus). Enable with
# stimulator.1.enable = 1; either disable FuzzARI (stimulator.0.enable = 0)
# or keep core2core.range.start disjoint from fuzz.ari.memory.[start,end)
# so unrelated traffic does not pollute the measurements.
[stimulator.1]
core2core.bench                 = 2
core2core.nodes                 = 0, 1
core2core.samples               = 10
core2core.iterations            = 100
core2core.warmup                = 10
core2core.lines                 = 32
core2core.inflight              = 4
# 0x88000000
core2core.range.start           = 2281701376
core2core.report.csv            = core2core.csv
core2core.report.svg            = core2core.svg

# Performance profiler: joint-level latency/occupancy/denial metrics plus
# Taurus channel/coherency counters. Enabled by default; report.text goes to
# the log, report.json / report.csv.dir are written when non-empty.
[profiler]
enable                          = 1
window                          = 1024
report.text                     = 1
report.json                     =
report.csv.dir                  =

# Simulation-throughput meter: wall-clock cycles/second of the simulation
# itself (not on-bus protocol metrics). Enabled by default; the in-flight
# display fires on whichever trigger comes first: every interval.cycles
# simulated cycles (0 = trigger off) or every interval.seconds wall-clock
# seconds (0 = trigger off). Both 0 = final summary only.
[simperf]
enable                          = 1
interval.cycles                 = 1000000
interval.seconds                = 600

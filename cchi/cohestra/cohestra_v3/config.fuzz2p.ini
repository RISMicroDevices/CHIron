# Cohestra V3 fuzz configuration for a Venus build with NUM_T1=2
# (-DCOHESTRA_V3_VENUS_NUM_T1=2). 2 Type-1 upstreams (Taurus), FuzzARI
# stimulator, CacheLineDataMonitor enabled.
# The cycle limit is CLI-only (`--cycles`); [root] maximum_cycles is not read
# by the v3 executable. See README.md "Fuzz sign-off".

[log]
verbose                         = 0

[verilated]
waveform.enable                 = 0
waveform.path                   =
; waveform.type must match the build's COHESTRA_V3_WAVEFORM_FORMAT (fst or vcd)
waveform.type                   = fst

[root]
reset_cycles                    = 100

# The verilated wrapper always exposes 8 Type-1 pin sets, so 8 node IDs must
# be listed. Nodes beyond the stimulator's active list attach but stay idle;
# active upstream indices must be < the build's NUM_T1.
upstream.type1.nodeid           = 0, 1, 2, 3, 4, 5, 6, 7
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0, 1

stimulator.1                    =
stimulator.1.enable             = 0

# CacheLineDataMonitor: scoreboards expected line images from Taurus CacheLine
# events and re-verifies every grant/load. Any mismatch fails the run (exit 2).
[monitor]
enable                          = 1
fail.on.mismatch                = 1
assume.zero.init                = 1
trace                           = 0
history.length                  = 8

# C++ AXIMemory window (VENUS_EXTMEM preset). Keep in sync with the fuzz range.
[memory]
start                           = 2147483648
end                             = 2684354560

[stimulator.0]
fuzz.ari.seed                   = 1000
fuzz.ari.interval               = 5000000
fuzz.ari.target                 = 24
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2684354560
fuzz.ari.cmo.enable             = 1
# CMO class rate: 1/8 of operations are CBOs (kept low so CleanInvalid/
# MakeInvalid don't flush the directory faster than it fills — the victim
# back-invalidation flow needs full sets to trigger)
fuzz.ari.cmo.ratio              = 8
# MakeInvalid share of CMOs: 1/4 (rest split between CBOClean/CBOFlush);
# MakeInvalid discards dirty data, so it is kept the rarest CMO
fuzz.ari.cmo.inval.ratio        = 4
fuzz.ari.range.tag              = 128
fuzz.ari.range.set              = 128
fuzz.ari.range.alias            = 4

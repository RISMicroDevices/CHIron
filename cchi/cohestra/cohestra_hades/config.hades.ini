# Cohestra / cohestra_hades configuration — Oceanus L2 HADES-Fabric smoke
# (reference copy; mirrors demo/oceanus_l2/cohestra/config.oceanus_hades.ini
# intent with the executable's real schema).
#
# Schema follows cchi/cohestra/cohestra_v3/config.ini; [hades] is the section
# consumed by the cohestra_hades layer only.

[log]
verbose                         = 0

[root]
# Reset stage keys: accepted for v3-compatible configs but NO-OPS over HADES —
# the FPGA-side wrapper (hades_oceanus_wrapper) owns the DUT reset stretch,
# and on loopback the mock resets atomically.
reset_preamble                  = 1024
reset_cycles                    = 100
reset_repeat                    = 1

# The PACKING.md boundary carries exactly one Type-1 port (t1p0).
upstream.type1.nodeid           = 0
upstream.type1.inflight.evt     = 16
upstream.type1.inflight.snp     = 16
upstream.type1.inflight.req     = 16
upstream.type1.inflight         = 32

# TX-channel (upstream -> DUT) FIFO depths of the CCHI interface. Over a link
# the retire echo lags by a whole window, so depth 4 (v3 default) is too
# shallow; 64 covers window_k=32 with margin. 0 disables a FIFO (pushes then
# always fail) — not useful here.
upstream.type1.buffer.evt       = 64
upstream.type1.buffer.req       = 64
upstream.type1.buffer.rsp       = 64
upstream.type1.buffer.dat       = 64

# FuzzARI — the proven XSCache soak stimulus (seed pinned for determinism runs;
# --seed on the CLI overrides fuzz.ari.seed).
stimulator.0                    = FuzzARI
stimulator.0.enable             = 1
stimulator.0.upstreams.type1    = 0

stimulator.1                    = Core2Core
stimulator.1.enable             = 0

[stimulator.0]
verbose = 0
verbose.flit = 0
verbose.xact = 0
verbose.internal = 0
verbose.backpressure = 0
verbose.port.busy = 0

fuzz.ari.seed                   = 9704
fuzz.ari.interval               = 400
fuzz.ari.target                 = 2
fuzz.ari.startup                = 8
fuzz.ari.maximum.cycle          = 0
fuzz.ari.memory.enable          = 1
fuzz.ari.memory.start           = 2147483648
fuzz.ari.memory.end             = 2684354560
fuzz.ari.cmo.enable             = 1
fuzz.ari.load.enable            = 1
fuzz.ari.store.enable           = 1
fuzz.ari.storeline.enable       = 1
fuzz.ari.cmo.clean.enable       = 1
fuzz.ari.cmo.flush.enable       = 1
fuzz.ari.cmo.inval.enable       = 1
fuzz.ari.range.tag              = 32
fuzz.ari.range.set              = 32
fuzz.ari.range.alias            = 4

[hades]
# HADES-Fabric link. The manifest path resolves relative to the CWD first,
# then relative to this INI file's directory.
manifest                        = demo/oceanus_l2/manifest.yaml
backend                         = jtag          # jtag (hardware) | loopback (mock)
jtag_url                        = tcp://127.0.0.1:3122
window_k                        = 32            # cycles of credit lead per grant
                                                # quantum (1 = lockstep debug)
# skid_depth: assumed per-drive-channel skid depth in hades_oceanus_wrapper
# (default 0 = window_k). The host never stages more than this many unaccepted
# flits per channel; must not exceed the wrapper's real depth.
skid_depth                      = 32
# rx_queue: local c2h queue bound per channel (the ready pre-assertion never
# lets it overflow; >= 2x window_k + granule slack is the comfortable region)
rx_queue                        = 1024
# legacy compatibility: accepted but not a fatal limit; stalls report every 5 s
max_quiet_polls                 = 2000000
# DUT-cycle anchoring (strict replay-determinism, spec §1.4/D2; README):
# view_latency: a received flit becomes visible to the Instance exactly this
# many harness cycles after its DUT cycle (never at harvest-arrival time).
# Deadlock floor = maxH2CGranule + maxC2HGranule (38 for the demo channels);
# the link clamps below it with a warning.
view_latency                    = 40
# anchor_l_*: extra DUT cycles beyond (production tick + 1) for response
# slots (UpRSP/UpDAT/axi b/r). 0 = production tick + 1 (causally safe).
anchor_l_rsp                    = 0
anchor_l_dat                    = 0
anchor_l_b                      = 0
anchor_l_r                      = 0

[watchdog]
# RTT-inflated over JTAG: scale generously; stalls are legal steady states
# (HADES never skips cycles — a stalled cycle simply doesn't exist).
enable                          = 1
progress.timeout                = 1000000
xact.timeout                    = 1000000

[monitor]
# cache-line data monitor: ON (this is the coherence oracle)
enable                          = 1

[profiler]
enable                          = 1
window                          = 1024
report.text                     = 1
report.json                     =
report.csv.dir                  =

[simperf]
enable                          = 1
interval.cycles                 = 1000000
interval.seconds                = 600
